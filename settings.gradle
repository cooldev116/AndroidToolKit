    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven {
            url "https://artifact.bytedance.com/repository/pangle"
        }
        maven {
            url = uri("E:/MavenRepo")
        }
    }
}

rootProject.name = "AndroidToolKit"
include ':app'
