plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
    id 'signing'
}

ext {
    PUBLISH_GROUP_ID = 'io.github.cooldev116'
    PUBLISH_ARTIFACT_ID = 'dev_adkit'
    PUBLISH_VERSION = '1.0.0'
}

android {
    namespace 'com.adwant.kit'
    compileSdk rootProject.ext.android.compileSdk

    defaultConfig {
        minSdk rootProject.ext.android.minSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation rootProject.ext.dependencies.coreKtx
    implementation rootProject.ext.dependencies.appcompat
    implementation rootProject.ext.dependencies.material
    implementation rootProject.ext.dependencies.constraintlayout
    implementation rootProject.ext.dependencies.junit
    implementation rootProject.ext.dependencies.junitExt
    implementation rootProject.ext.dependencies.espresso

    implementation rootProject.ext.dependencies.viewModelKtx
    implementation rootProject.ext.dependencies.liveDataKtx
    implementation rootProject.ext.dependencies.lifecycleProcess
    implementation rootProject.ext.dependencies.activity
    implementation rootProject.ext.dependencies.activityKtx
    implementation rootProject.ext.dependencies.fragment
    implementation rootProject.ext.dependencies.fragmentKtx
    implementation rootProject.ext.dependencies.extensions
    implementation rootProject.ext.dependencies.autoSize
    implementation rootProject.ext.dependencies.immersionbar
    implementation rootProject.ext.dependencies.immersionbarKtx
    implementation rootProject.ext.dependencies.toolkit

    implementation 'com.pangle_beta.cn:mediation-sdk:7.4.2.0' //穿山甲融合SDK
    implementation 'com.pangle_beta.cn:mediation-test-tools:7.4.1.4' //穿山甲融合测试工具
    implementation 'com.pangle_beta.cn:mediation-gdt-adapter:4.662.1532.0'  //GDT 优量汇 adapter
    implementation 'com.pangle_beta.cn:mediation-baidu-adapter:9.423.3'  //Baidu adapter
    implementation 'com.pangle_beta.cn:mediation-ks-adapter:4.11.20.1.0'
    //KS adapter
//    implementation 'com.pangle_beta.cn:mediation-sigmob-adapter:4.25.2.0'

    // Maven-available ADN SDKs
    implementation 'com.qq.e.union:union:4.662.1532' // 优量汇 SDK

    // KS / Sigmob are usually delivered as vendor AAR packages
    // Required versions for current adapters:
    // KS: 4.11.20.1, Sigmob(WindAd): 4.25.2, sigmob_common: 1.8.6
//    implementation fileTree(dir: 'libs/adn', include: ['*.aar', '*.jar'])
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = PUBLISH_GROUP_ID
                artifactId = PUBLISH_ARTIFACT_ID
                version = PUBLISH_VERSION

                pom {
                    name = 'Dev AdKit'
                    description = '广告封装'
                    url = 'https://github.com/cooldev116/AndroidToolKit'
                    inceptionYear = '2025'

                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            distribution = 'repo'
                        }
                    }

                    developers {
                        developer {
                            id = 'cooldev116'
                            name = 'cooldev116'
                            email = '495776706@qq.com'
                            url = 'https://github.com/cooldev116'
                        }
                    }

                    scm {
                        connection = 'scm:git:git://github.com/cooldev116/AndroidToolKit.git'
                        developerConnection = 'scm:git:ssh://github.com/cooldev116/AndroidToolKit.git'
                        url = 'https://github.com/cooldev116/AndroidToolKit'
                    }
                }
            }
        }

        repositories {
            maven {
                name = 'MavenCentral'
                url = uri('https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/')
                credentials {
                    username = findProperty('mavenCentralUsername') ?: ''
                    password = findProperty('mavenCentralPassword') ?: ''
                }
            }
        }
    }

    signing {
        def keyFilePath = findProperty('signingKeyFile')?.toString()
        def inMemoryKey = findProperty('signingInMemoryKey')?.toString()
        def keyId = findProperty('signingInMemoryKeyId')?.toString()
        def keyPassword = findProperty('signingInMemoryKeyPassword')?.toString() ?: ''

        def key = null
        if (keyFilePath) {
            def keyFile = file(keyFilePath)
            if (!keyFile.exists()) {
                throw new GradleException("signingKeyFile not found: ${keyFilePath}")
            }
            key = keyFile.getText('UTF-8')
        } else if (inMemoryKey) {
            key = inMemoryKey.replace('\\n', '\n')
        }

        if (key) {
            if (keyId) {
                useInMemoryPgpKeys(keyId, key, keyPassword)
            } else {
                useInMemoryPgpKeys(key, keyPassword)
            }
        }

        required { true }
        sign publishing.publications.release
    }
}

tasks.register('notifyCentralPortal') {
    group = 'publishing'
    description = 'Notify Central Portal after publishing so the deployment becomes visible'

    doLast {
        def username = findProperty('mavenCentralUsername')
        def password = findProperty('mavenCentralPassword')
        if (!username || !password) {
            throw new GradleException('Missing mavenCentralUsername / mavenCentralPassword in ~/.gradle/gradle.properties')
        }

        def auth = "${username}:${password}".bytes.encodeBase64().toString()
        def url = new URL("https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${PUBLISH_GROUP_ID}")
        def conn = url.openConnection()
        conn.requestMethod = 'POST'
        conn.setRequestProperty('Authorization', "Basic ${auth}")
        conn.doOutput = true
        conn.outputStream.close()

        def code = conn.responseCode
        if (code < 200 || code >= 300) {
            def errorBody = ''
            try {
                errorBody = conn.errorStream?.text
            } catch (ignored) {
            }
            throw new GradleException("Failed to notify Central Portal: HTTP ${code} ${errorBody}")
        }
        println "Central Portal notified for ${PUBLISH_GROUP_ID}. Open https://central.sonatype.com/publishing/deployments and click Publish."
    }
}

tasks.register('publishToMavenCentral') {
    group = 'publishing'
    description = 'Publish release to Maven Central staging and notify Central Portal'
    dependsOn 'publishReleasePublicationToMavenCentralRepository', 'notifyCentralPortal'
    tasks.findByName('notifyCentralPortal')?.mustRunAfter('publishReleasePublicationToMavenCentralRepository')
}
