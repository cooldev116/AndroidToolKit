plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
    id 'signing'
}

android {
    namespace 'com.snowflake.toolkit'
    compileSdk rootProject.ext.android.compileSdk

    defaultConfig {
        minSdkVersion rootProject.ext.android.minSdk
        targetSdkVersion rootProject.ext.android.targetSdk
        versionCode rootProject.ext.android.versionCode
        versionName rootProject.ext.android.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = "io.github.cooldev116"
                artifactId = "toolkit"
                version = "1.0.0"
                from components.release

                pom {
                    name = "AndroidToolKit"
                    description = "Common Android utility library"
                    url = "https://github.com/cooldev116/AndroidToolKit"
                    licenses {
                        license {
                            name = "The Apache License, Version 2.0"
                            url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                        }
                    }
                    developers {
                        developer {
                            id = "cooldev116"
                            name = "cooldev116"
                            email = "495776706@qq.com"
                        }
                    }
                    scm {
                        connection = "scm:git:git://github.com/cooldev116/AndroidToolKit.git"
                        developerConnection = "scm:git:ssh://git@github.com/cooldev116/AndroidToolKit.git"
                        url = "https://github.com/cooldev116/AndroidToolKit"
                    }
                }
            }
        }
        repositories {
            maven {
                name = 'ossrhStagingApi'
                url = uri("https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/")
                credentials {
                    username = findProperty("mavenCentralUsername")
                    password = findProperty("mavenCentralPassword")
                }
            }
        }
    }

    // GPG 私钥：$GRADLE_USER_HOME/signing-key.asc，密码：gradle.properties 里的 gpg.passphrase
    signing {
        def keyFile = new File(gradle.gradleUserHomeDir, "signing-key.asc")
        useInMemoryPgpKeys(keyFile.getText("UTF-8").trim(), providers.gradleProperty("gpg.passphrase").get())
        sign publishing.publications.release
    }
}

// Central Portal 需要额外一步提交 Deployment（maven-publish 官方兼容方式）
tasks.register("finalizeMavenCentralDeployment") {
    group = "publishing"
    dependsOn "publishReleasePublicationToOssrhStagingApiRepository"
    doLast {
        def user = findProperty("mavenCentralUsername")
        def pass = findProperty("mavenCentralPassword")
        def token = "${user}:${pass}".bytes.encodeBase64().toString()
        def url = new URL("https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.github.cooldev116")
        def conn = url.openConnection()
        conn.setRequestMethod("POST")
        conn.setRequestProperty("Authorization", "Bearer ${token}")
        conn.setDoOutput(true)
        conn.getOutputStream().close()
        if (conn.getResponseCode() >= 300) {
            throw new GradleException("Central Portal submit failed: ${conn.getResponseCode()}")
        }
    }
}

tasks.register("publishToMavenCentral") {
    group = "publishing"
    dependsOn "finalizeMavenCentralDeployment"
}

dependencies {
    implementation rootProject.ext.dependencies.coreKtx
    implementation rootProject.ext.dependencies.appcompat
    implementation rootProject.ext.dependencies.material
    implementation rootProject.ext.dependencies.constraintlayout
    implementation rootProject.ext.dependencies.junit
    implementation rootProject.ext.dependencies.junitExt
    implementation rootProject.ext.dependencies.espresso
    implementation rootProject.ext.dependencies.viewModelKtx
    implementation rootProject.ext.dependencies.liveDataKtx
    implementation rootProject.ext.dependencies.activity
    implementation rootProject.ext.dependencies.activityKtx
    implementation rootProject.ext.dependencies.fragment
    implementation rootProject.ext.dependencies.fragmentKtx
    implementation rootProject.ext.dependencies.extensions
    implementation rootProject.ext.dependencies.autoSize
    implementation rootProject.ext.dependencies.immersionbar
    implementation rootProject.ext.dependencies.immersionbarKtx
    implementation rootProject.ext.dependencies.BaseRecyclerViewAdapterHelper
    implementation rootProject.ext.dependencies.refreshKernel
    implementation rootProject.ext.dependencies.refreshHeader
    implementation rootProject.ext.dependencies.refreshFooter
    implementation rootProject.ext.dependencies.rWidgetHelper
    implementation rootProject.ext.dependencies.glide
    implementation rootProject.ext.dependencies.xxPermission
    implementation rootProject.ext.dependencies.mmkv
    implementation 'androidx.startup:startup-runtime:1.2.0'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
}
