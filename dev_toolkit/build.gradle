plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
}

ext {
    PUBLISH_GROUP_ID = 'io.github.cooldev116'
    PUBLISH_ARTIFACT_ID = 'dev-toolkit'
    PUBLISH_VERSION = '1.1.0'
    // 与 settings.gradle 依赖解析路径一致，仅本机本地仓
    LOCAL_MAVEN_URL = uri('E:/MavenRepo')
}

android {
    namespace 'com.snowflake.toolkit'
    compileSdk rootProject.ext.android.compileSdk

    defaultConfig {
        minSdkVersion rootProject.ext.android.minSdk
        targetSdkVersion rootProject.ext.android.targetSdk
        versionCode rootProject.ext.android.versionCode
        versionName rootProject.ext.android.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation rootProject.ext.dependencies.coreKtx
    implementation rootProject.ext.dependencies.appcompat
    implementation rootProject.ext.dependencies.material
    implementation rootProject.ext.dependencies.constraintlayout
    implementation rootProject.ext.dependencies.junit
    implementation rootProject.ext.dependencies.junitExt
    implementation rootProject.ext.dependencies.espresso
    implementation rootProject.ext.dependencies.viewModelKtx
    implementation rootProject.ext.dependencies.liveDataKtx
    implementation rootProject.ext.dependencies.activity
    implementation rootProject.ext.dependencies.activityKtx
    implementation rootProject.ext.dependencies.fragment
    implementation rootProject.ext.dependencies.fragmentKtx
    implementation rootProject.ext.dependencies.extensions
    implementation rootProject.ext.dependencies.autoSize
    implementation rootProject.ext.dependencies.immersionbar
    implementation rootProject.ext.dependencies.immersionbarKtx
    implementation rootProject.ext.dependencies.BaseRecyclerViewAdapterHelper
    implementation rootProject.ext.dependencies.refreshKernel
    implementation rootProject.ext.dependencies.refreshHeader
    implementation rootProject.ext.dependencies.refreshFooter
    implementation rootProject.ext.dependencies.rWidgetHelper
    implementation rootProject.ext.dependencies.glide
    implementation rootProject.ext.dependencies.xxPermission
    implementation rootProject.ext.dependencies.mmkv
    implementation 'androidx.startup:startup-runtime:1.2.0'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"

    // 网络：api 传递 Retrofit，便于宿主定义 ApiService 接口
    api rootProject.ext.dependencies.retrofit
    api rootProject.ext.dependencies.converterGson
    implementation rootProject.ext.dependencies.loggingInterceptor
    // Timber：api 传递，宿主可直接 Timber.d；关键节点日志依赖此库
    api rootProject.ext.dependencies.timber
    api rootProject.ext.dependencies.agentWeb

    // Android_CN_OAID（公开 JitPack 坐标，api 传递给宿主；排除需华为/荣耀私有仓的标识库）
    api(rootProject.ext.dependencies.cnOaid) {
        exclude group: 'com.huawei.hms', module: 'ads-identifier'
        exclude group: 'com.hihonor.mcs', module: 'ads-identifier'
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = PUBLISH_GROUP_ID
                artifactId = PUBLISH_ARTIFACT_ID
                version = PUBLISH_VERSION

                pom {
                    name = 'Dev Toolkit'
                    description = '安卓开发工具类'
                }
            }
        }

        repositories {
            maven {
                name = 'LocalMaven'
                url = LOCAL_MAVEN_URL
            }
        }
    }
}

// 发布到本机本地 Maven（E:/MavenRepo），不上传远端
tasks.register('publishToLocalMaven') {
    group = 'publishing'
    description = 'Publish release to local Maven repo (E:/MavenRepo)'
    dependsOn 'publishReleasePublicationToLocalMavenRepository'
}
