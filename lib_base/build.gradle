plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'com.ddmh.base'
    compileSdk rootProject.ext.android.compileSdk

    defaultConfig {
        minSdk rootProject.ext.android.minSdk
        targetSdk rootProject.ext.android.targetSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding = true
    }
}

dependencies {
    api rootProject.ext.dependencies.coreKtx
    api rootProject.ext.dependencies.appcompat
    api rootProject.ext.dependencies.material
    api rootProject.ext.dependencies.constraintlayout
    api rootProject.ext.dependencies.junit
    api rootProject.ext.dependencies.junitExt
    api rootProject.ext.dependencies.espresso

    api rootProject.ext.dependencies.viewModelKtx
    api rootProject.ext.dependencies.liveDataKtx
    api rootProject.ext.dependencies.activity
    api rootProject.ext.dependencies.activityKtx
    api rootProject.ext.dependencies.fragment
    api rootProject.ext.dependencies.fragmentKtx
    api rootProject.ext.dependencies.extensions
    api rootProject.ext.dependencies.autoSize
    api rootProject.ext.dependencies.immersionbar
    api rootProject.ext.dependencies.immersionbarKtx
    api rootProject.ext.dependencies.BaseRecyclerViewAdapterHelper
    api rootProject.ext.dependencies.refreshKernel
    api rootProject.ext.dependencies.refreshHeader
    api rootProject.ext.dependencies.refreshFooter
    api rootProject.ext.dependencies.rWidgetHelper
    api rootProject.ext.dependencies.glide
    api rootProject.ext.dependencies.xxPermission
}